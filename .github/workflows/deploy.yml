name: Build and Deploy

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - '.claude/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

env:
  IMAGE_NAME: quiz-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: ./mvnw --batch-mode clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Package application
        run: ./mvnw --batch-mode package -DskipTests

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest .
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          set -euo pipefail
          echo "========== 배포 시작 (blue-green) =========="
          cd /root/quiz

          UPSTREAM=/etc/nginx/conf.d/quiz-upstream.conf

          echo "0. compose/설정 동기화 (compose 변경도 푸시만으로 반영)"
          git pull --ff-only

          echo "1. 이미지 Pull (커밋 SHA 태그 — :latest 전파 지연 레이스 방지)"
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/quiz-app:${{ github.sha }}
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/quiz-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/quiz-app:latest

          echo "2. 현재 활성 색 판별 (upstream 파일 기준, 없으면 green 활성으로 간주해 blue에 배포)"
          if grep -qs "8092" "$UPSTREAM"; then
            ACTIVE=blue;  IDLE=green; IDLE_PORT=8093
          else
            ACTIVE=green; IDLE=blue;  IDLE_PORT=8092
          fi
          echo "   active=$ACTIVE -> deploy=$IDLE (:$IDLE_PORT)"

          echo "3. 유휴 색 기동 (활성 색은 계속 트래픽 처리 중)"
          docker compose up -d --no-deps --force-recreate "app-$IDLE"

          echo "4. 헬스체크 (최대 90초) — 실패 시 전환하지 않음 = 기존 버전 그대로 서비스"
          HEALTHY=0
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$IDLE_PORT/actuator/health" 2>/dev/null | grep -q '"status":"UP"'; then
              echo "   OK (${i}번째 시도)"
              HEALTHY=1
              break
            fi
            sleep 3
          done
          if [ "$HEALTHY" != "1" ]; then
            echo "   헬스체크 실패 — 신규 컨테이너 정지 후 종료 (서비스 영향 없음)"
            docker compose logs --tail=50 "app-$IDLE" || true
            docker compose stop "app-$IDLE"
            exit 1
          fi

          echo "5. 트래픽 전환 (nginx upstream 재작성 + reload)"
          printf 'upstream quiz_backend {\n    server 127.0.0.1:%s;   # active: %s\n}\n' "$IDLE_PORT" "$IDLE" > "$UPSTREAM"
          nginx -t
          nginx -s reload

          echo "6. 외부 응답 확인"
          curl -fsS -o /dev/null -w "   https 응답: %{http_code}\n" https://game.kyuhyeong.com/

          echo "7. 구 색 드레인 후 정지 (진행 중 요청 정리 대기)"
          sleep 30
          docker compose stop "app-$ACTIVE" || true

          echo "8. 사용하지 않는 이미지 정리"
          docker image prune -f

          echo "9. 컨테이너 상태 확인"
          docker compose ps

          echo "========== 배포 완료 ($ACTIVE -> $IDLE) =========="
