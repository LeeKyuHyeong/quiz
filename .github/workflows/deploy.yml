name: Build and Deploy

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - '.claude/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

env:
  IMAGE_NAME: khgame-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest .
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          set -euo pipefail
          echo "========== 배포 시작 =========="
          cd /root/game

          echo "1. 최신 이미지 Pull (compose 기준)"
          docker compose pull app

          echo "2. 앱 컨테이너 강제 재생성 (DB는 건드리지 않음)"
          docker compose up -d --no-deps --force-recreate app

          echo "3. 사용하지 않는 이미지 정리"
          docker image prune -f

          echo "4. 컨테이너 상태 확인"
          docker compose ps

          echo "========== 배포 완료 =========="
