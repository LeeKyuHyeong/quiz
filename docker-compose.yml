# blue/green 공통 설정 — 두 서비스가 동일해야 하므로 반드시 여기서만 수정
x-app-common: &app-common
  image: ${DOCKERHUB_USERNAME}/quiz-app:latest
  restart: unless-stopped
  environment:
    SPRING_PROFILES_ACTIVE: prod
    SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/song?useUnicode=true&characterEncoding=utf8mb4
    SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
    SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    BREVO_API_KEY: ${BREVO_API_KEY}
    MAIL_FROM: ${MAIL_FROM}
    TZ: Asia/Seoul
    # 50%: limit 상향분을 힙이 먹지 않도록. 힙 320MiB 유지가 목적
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50 -XX:+UseSerialGC"
  volumes:
    - uploads:/app/uploads
    - /etc/localtime:/etc/localtime:ro
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    # 이미지가 alpine이라 curl 없음 — busybox wget 사용. 내부 포트는 8082
    test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8082/actuator/health || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 60s
  deploy:
    resources:
      limits:
        memory: 640M      # 512M → 640M. peak 471/512=92% (2026-09-04 측정)
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # MariaDB
  db:
    image: mariadb:11.8
    # localhost 전용 (2026-07-24) — 외부 접속은 SSH 터널(Tailscale). 0.0.0.0 금지.
    ports:
      - "127.0.0.1:3308:3306"
    container_name: quiz-db
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: song
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
    # 뒤쪽 3개 플래그: 메모리 튜닝 (2026-07-24) — 버퍼풀 96M, 커넥션 50, perf 스키마 OFF
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=96M --max-connections=50 --performance-schema=OFF
    healthcheck:
      # healthcheck.sh 는 볼륨 init 때 생성되는 전용 계정 필요 — 구버전 init 볼륨이라 항상 unhealthy
      # → root SELECT 1 로 교체 (2026-06-05, khshop 과 동일 문제 예방)
      test: ["CMD-SHELL", "mariadb -u root -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Spring Boot App — blue/green 두 벌 (무중단 배포, 2026-09-08)
  # nginx(/etc/nginx/conf.d/quiz-upstream.conf)가 활성 색 하나만 바라보고,
  # 배포 시 유휴 색을 새 이미지로 기동 → 헬스 통과 확인 후 upstream 전환 → 구 색 정지.
  # 평시에는 한 색만 떠 있음. 공통 설정은 x-app-common 앵커 한 곳에서만 수정할 것.
  app-blue:
    <<: *app-common
    container_name: quiz-app-blue
    ports:
      - "127.0.0.1:8092:8082"  # localhost 전용(nginx만 접근) — 외부 노출 금지
  app-green:
    <<: *app-common
    container_name: quiz-app-green
    ports:
      - "127.0.0.1:8093:8082"  # localhost 전용(nginx만 접근) — 외부 노출 금지

volumes:
  db-data:
  uploads:
