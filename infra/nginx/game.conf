# /etc/nginx/conf.d/game.conf — 운영 서버 사본 (2026-09-14 실측)
# 서버의 원본이 진실이다. 이 파일은 재구축용 참조이며 배포 스크립트가 건드리지 않는다.
# 443 블록 규칙:
#   - `location /actuator { deny all; }` 는 반드시 443 블록에 (80 블록은 리다이렉트만 하므로 무의미)
#   - `location /ws/` 는 WebSocket 업그레이드 전달용. 없으면 SockJS 가 xhr 폴백으로만 동작한다 (2026-09-14 발견·추가)
#   - upstream `quiz_backend` 는 quiz-upstream.conf 에 있고 배포 스크립트가 활성 색으로 다시 쓴다
server {
    server_name game.kyuhyeong.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location /actuator { deny all; }
    location /ws/ {
        proxy_pass http://quiz_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://quiz_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/game.kyuhyeong.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/game.kyuhyeong.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = game.kyuhyeong.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name game.kyuhyeong.com;
    return 404; # managed by Certbot
}
