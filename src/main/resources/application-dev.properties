# Development Configuration
server.port=8082

# MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/song?allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Session: 메모리(Tomcat). DB 세션 저장소를 로컬에서 보려면 -Dspring-boot.run.profiles=dev,session-jdbc (SPRING_SESSION 테이블 필요, sql/schema.sql)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# JPA
# validate: 스키마의 단일 출처는 sql/schema.sql — 엔티티 변경 시 schema.sql 을 먼저 갱신하고 로컬 DB에 반영
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.song=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Brevo Transactional Email API (이메일 인증)
# 환경변수 BREVO_API_KEY, MAIL_FROM 로 주입
# 발급: brevo.com 가입 → SMTP & API 메뉴 → API Keys 탭 → "v3 API Key" 생성
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.brevo.base-url=https://api.brevo.com/v3
app.mail.from=${MAIL_FROM:}
app.mail.from-name=Song Quiz

# Admin Account (DB 기반 인증으로 변경됨 - Member 테이블의 role=ADMIN 사용)
