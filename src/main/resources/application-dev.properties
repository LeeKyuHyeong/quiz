# Development Configuration
server.port=8082

# MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/song?allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Logging
logging.level.com.song=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Gmail SMTP (이메일 인증)
# 환경변수 MAIL_USERNAME, MAIL_PASSWORD 로 주입 (Gmail 앱 비밀번호 사용)
# 발급 방법: Google 계정 → 보안 → 2단계 인증 → 앱 비밀번호
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 이메일 인증 발신자 정보
app.mail.from=${MAIL_USERNAME:}
app.mail.from-name=Song Quiz

# Admin Account (DB 기반 인증으로 변경됨 - Member 테이블의 role=ADMIN 사용)
