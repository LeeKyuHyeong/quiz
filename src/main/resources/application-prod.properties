# Production Configuration
server.port=8082

# Nginx 리버스 프록시 설정 (X-Forwarded-* 헤더 인식)
server.forward-headers-strategy=native

# MariaDB - 환경변수로 오버라이드 가능
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://db:3306/song}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Thymeleaf
spring.thymeleaf.cache=true

# Logging
logging.level.com.song=INFO
logging.level.org.hibernate.SQL=ERROR

# Gmail SMTP (이메일 인증)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_USERNAME:}
app.mail.from-name=Song Quiz

# Admin Account (DB 기반 인증으로 변경됨 - Member 테이블의 role=ADMIN 사용)
