# 로그인 세션을 DB 에 저장 (Spring Session JDBC). prod 는 spring.profiles.group.prod 로 자동 포함, dev·test 는 뒤에 겹쳐 켠다.
# dev·test 프로파일이 걸어 둔 SessionAutoConfiguration 제외를 되돌린다 (이 프로파일이 더 뒤에 오므로 이 값이 이긴다)
spring.autoconfigure.exclude=

# 스키마: embedded(H2 = 테스트)일 때만 자동 생성. MariaDB 는 sql/schema.sql 의 SPRING_SESSION 두 테이블을 배포 전에 먼저 만든다 —
# 테이블 없이 새 프로세스가 뜨면 헬스는 UP 인데 세션을 만드는 첫 요청부터 전부 500 이다.
spring.session.jdbc.initialize-schema=embedded
# 만료 행 정리 주기(기본 매분). 만료 판정 자체는 읽는 시점에 하므로 정리가 늦어도 만료된 세션이 살아나지는 않는다
spring.session.jdbc.cleanup-cron=0 * * * * *
