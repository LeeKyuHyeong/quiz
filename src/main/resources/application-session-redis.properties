# 로그인 세션을 Redis 에 저장 (Spring Session Data Redis) — AWS 시연(EC2 2대 + ElastiCache)용. VPS 운영(prod)은 session-jdbc 그대로.
# 로컬: docker run -d --name quiz-redis -p 6379:6379 redis:7-alpine → -Dspring-boot.run.profiles=dev,session-redis
# 요청 제한·presence·언로드 토큰은 그대로 인스턴스 메모리다 (2대 시연은 로그인·세션만, 2026-09-18 결정).

# dev·test 가 걸어 둔 Session·Redis 자동구성 제외를 모두 되돌린다 (이 프로파일이 더 뒤에 오므로 이 값이 이긴다)
spring.autoconfigure.exclude=

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# ElastiCache 전송 중 암호화(TLS)를 켠 클러스터면 true
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
# Redis 가 죽으면 요청이 60초(Lettuce 기본) 매달리지 않고 바로 실패하게. 폴백은 없다 — /actuator/health 가 DOWN 이 돼 배포 게이트가 막는다
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# indexed: principal(이메일) 인덱스가 있어야 SpringSessionBackedSessionRegistry(1계정 1세션·관리자 강제 종료·비밀번호 재설정 뒤 만료)가 된다
spring.session.redis.repository-type=indexed
spring.session.redis.namespace=quiz:session
# ElastiCache 는 CONFIG 명령이 막혀 있어 notify-keyspace-events 를 앱이 켤 수 없다. 이벤트 없이도 만료는 키 TTL 로, 인덱스의 죽은 항목은
# 읽을 때 걸러진다(SessionLifecycleRedisContractTest 가 이 설정 그대로 확인). 만료 세션 정리 작업은 기본 매분
spring.session.redis.configure-action=none
