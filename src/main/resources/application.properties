# Default Configuration
spring.application.name=song

# Active Profile: 기본값 없음 — 반드시 명시 (-Dspring-boot.run.profiles=dev / SPRING_PROFILES_ACTIVE=prod)
# 기본값이 dev 이면 프로파일을 빠뜨린 실행이 조용히 로컬 DB에 붙는다

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session
server.servlet.session.timeout=60m
spring.session.timeout=60m
# 세션 저장소: prod 는 DB(Spring Session JDBC) — 배포·재시작으로 프로세스가 바뀌어도 로그인이 유지된다 (O-020).
# dev·test 는 각 프로파일에서 SessionAutoConfiguration 을 제외해 메모리 세션. 필요하면 session-jdbc 를 겹쳐 켠다 (dev,session-jdbc).
# AWS 시연은 session-redis (ElastiCache). Redis 클라이언트가 클래스패스에 있으므로 Redis 자동구성은 여기서 끄고 session-redis 만 되돌린다 —
# 켜 두면 프로파일과 상관없이 Redis 세션 저장소가 JDBC 보다 먼저 잡혀(SessionAutoConfiguration 순서) prod 가 기동하지 못하고,
# 헬스 지표가 localhost:6379 에 붙으려다 DOWN 이 된다. spring.autoconfigure.exclude 는 프로파일 파일이 통째로 덮어쓰므로
# dev·test·session-jdbc 도 같은 목록을 들고 있다 (SessionStoreProfileTest 가 고정).
spring.profiles.group.prod=session-jdbc
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=uploads/songs