<!-- 아티스트별 통계 탭 콘텐츠 (프래그먼트) -->
<div class="popularity-tab-content" xmlns:th="http://www.thymeleaf.org">
    <!-- 서브 통계 -->
    <div class="sub-stats">
        <div class="sub-stat">
            <span class="sub-stat-value" th:text="${totalItems}">0</span>
            <span class="sub-stat-label">아티스트 수</span>
        </div>
    </div>

    <!-- 검색 -->
    <div class="search-bar">
        <form class="search-form">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="아티스트 검색">
            <button type="submit" class="btn btn-search">검색</button>
            <a th:if="${keyword != null}" href="#" class="btn btn-reset" onclick="resetSearch()">초기화</a>
        </form>
    </div>

    <!-- 테이블 -->
    <div class="table-container">
        <table class="data-table sortable-table">
            <thead>
            <tr>
                <th class="col-no">No</th>
                <th class="sortable" th:classappend="${sort == 'artist'} ? ('sorted-' + ${direction})"
                    data-sort="artist">아티스트 <span class="sort-icon"></span></th>
                <th class="sortable" th:classappend="${sort == 'songCount'} ? ('sorted-' + ${direction})"
                    data-sort="songCount">곡 수 <span class="sort-icon"></span></th>
                <th class="sortable" th:classappend="${sort == 'avgRating'} ? ('sorted-' + ${direction})"
                    data-sort="avgRating">평균 평점 <span class="sort-icon"></span></th>
                <th class="sortable" th:classappend="${sort == 'totalVotes'} ? ('sorted-' + ${direction})"
                    data-sort="totalVotes">총 투표 <span class="sort-icon"></span></th>
                <th>대중성 등급</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="stat, iterStat : ${artistStats}" onclick="toggleRowExpand(this)">
                <td data-label="No" th:text="${currentPage * size + iterStat.index + 1}"></td>
                <td data-label="아티스트" th:text="${stat.artist}"></td>
                <td data-label="곡 수" th:text="${stat.songCount}"></td>
                <td data-label="평균 평점">
                    <div class="rating-display">
                        <span class="rating-stars" th:attr="data-rating=${stat.avgRating}">
                            <span th:each="i : ${#numbers.sequence(1, 5)}"
                                  th:classappend="${i <= stat.avgRating} ? 'filled' : 'empty'"
                                  class="star">★</span>
                        </span>
                        <span class="rating-value" th:text="${#numbers.formatDecimal(stat.avgRating, 1, 1)}"></span>
                    </div>
                </td>
                <td data-label="총 투표" th:text="${stat.totalVotes}"></td>
                <td data-label="대중성 등급">
                    <span class="popularity-grade"
                          th:classappend="${stat.avgRating <= 1.5} ? 'very-popular' : (${stat.avgRating <= 2.5} ? 'popular' : (${stat.avgRating <= 3.5} ? 'normal' : (${stat.avgRating <= 4.5} ? 'maniac' : 'very-maniac')))">
                        <th:block th:if="${stat.avgRating <= 1.5}">🌟 매우 대중적</th:block>
                        <th:block th:if="${stat.avgRating > 1.5 and stat.avgRating <= 2.5}">⭐ 대중적</th:block>
                        <th:block th:if="${stat.avgRating > 2.5 and stat.avgRating <= 3.5}">🎵 보통</th:block>
                        <th:block th:if="${stat.avgRating > 3.5 and stat.avgRating <= 4.5}">🎸 매니악</th:block>
                        <th:block th:if="${stat.avgRating > 4.5}">💀 매우 매니악</th:block>
                    </span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(artistStats)}">
                <td colspan="6" class="empty-row">투표 데이터가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <div class="pagination" th:if="${totalPages > 0}">
        <a href="#" th:classappend="${currentPage == 0} ? 'disabled'" class="page-link"
           data-page="0" onclick="goToPage(this.dataset.page); return false;">«</a>
        <a href="#" th:classappend="${currentPage == 0} ? 'disabled'" class="page-link"
           th:data-page="${currentPage - 1}" onclick="goToPage(this.dataset.page); return false;">‹</a>

        <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:if="${i >= currentPage - 2 and i <= currentPage + 2}"
               href="#" th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active'" class="page-link"
               th:data-page="${i}" onclick="goToPage(this.dataset.page); return false;"></a>
        </th:block>

        <a href="#" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'" class="page-link"
           th:data-page="${currentPage + 1}" onclick="goToPage(this.dataset.page); return false;">›</a>
        <a href="#" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'" class="page-link"
           th:data-page="${totalPages - 1}" onclick="goToPage(this.dataset.page); return false;">»</a>
    </div>
</div>
