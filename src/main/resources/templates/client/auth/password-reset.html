<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/fragments/head :: clientHead('비밀번호 재설정 - Song Quiz')}"></head>
<body class="client-page auth-page">
<div class="client-container">
    <header class="client-header compact">
        <nav class="header-nav">
            <a href="/" class="btn-home">🏠 홈</a>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🔑 비밀번호 재설정</h1>
                <p>가입한 이메일로 인증 코드를 받아 새 비밀번호를 설정합니다</p>
            </div>

        <form id="resetForm" class="auth-form">
            <div class="form-group">
                <label for="email">이메일</label>
                <div class="input-with-button">
                    <input type="email" id="email" name="email" placeholder="example@email.com" required
                           th:value="${email}" th:readonly="${email != null}">
                    <button type="button" class="btn btn-verify" id="sendCodeBtn">인증코드 받기</button>
                </div>
                <small class="field-hint" id="emailHint"></small>
            </div>

            <div class="form-group hidden" id="codeGroup">
                <label for="verifyCode">인증 코드</label>
                <div class="input-with-button">
                    <input type="text" id="verifyCode" name="verifyCode" placeholder="6자리 숫자" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                    <button type="button" class="btn btn-verify" id="verifyCodeBtn">인증 확인</button>
                </div>
                <small class="field-hint" id="verifyHint"></small>
            </div>

            <div class="form-group hidden" id="passwordGroup">
                <label for="password">새 비밀번호</label>
                <input type="password" id="password" name="password" placeholder="4자 이상" minlength="4" autocomplete="new-password">
            </div>

            <div class="form-group hidden" id="passwordConfirmGroup">
                <label for="passwordConfirm">새 비밀번호 확인</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호 재입력" autocomplete="new-password">
                <small class="field-hint" id="passwordHint"></small>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <button type="submit" class="btn btn-auth" id="submitBtn" disabled>비밀번호 변경</button>
        </form>

        <div class="auth-footer">
            <p><a href="/auth/login">로그인으로 돌아가기</a></p>
        </div>
        </div>
    </div>
</div>

<script th:src="@{/js/client/auth-password-reset.js}"></script>
</body>
</html>
