# Test configuration - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MariaDB
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Session: 메모리(Tomcat). DB 세션 저장소 경로는 @ActiveProfiles({"test","session-jdbc"}) 가 이 제외를 되돌려 H2 에서 돈다
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# Disable batch scheduler for tests
spring.main.allow-bean-definition-overriding=true

# Disable scheduling for tests
spring.task.scheduling.pool.size=0

# Unload (tab close) leave grace - short for tests
game.multi.unload-grace-ms=150

# Presence (all room-topic WebSocket connections gone) leave grace - short for tests
game.multi.disconnect-grace-ms=300

# Presence startup sweep (participants without a connection after a restart) - off for tests.
# Contexts are cached for the whole suite, so a delayed sweep would fire in the middle of unrelated tests.
# RoomPresenceStartupSweepReadyTest turns it on for its own context.
game.multi.startup-sweep-delay-ms=-1
